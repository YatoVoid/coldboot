name: self-test

# Runs every module's --demo the way a stranger gets the repo: a clean
# checkout with no config.json. That is exactly the case that broke once,
# where the demos worked here and crashed for anyone who cloned it.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  demos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # the demos only need the light dependencies. whisper, kokoro and the
      # google client are imported inside the functions that use them, so a
      # self-test does not have to download hundreds of megabytes.
      - name: install
        run: python -m pip install --quiet "requests>=2.32,<3" "defusedxml>=0.7,<1"

      - name: no config.json, as a fresh clone would be
        shell: bash
        run: test ! -f config.json

      # an unquoted >= in a shell command writes a file called 0.7 and git add
      # -A commits it. that has happened twice, so stop asking people to be
      # careful and just fail the build.
      - name: no empty or junk files committed
        shell: bash
        run: |
          bad=0
          while read -r f; do
            if [ ! -s "$f" ]; then echo "empty file tracked: $f"; bad=1; fi
          done < <(git ls-files)
          while read -r f; do
            case "$f" in
              *.py|*.md|*.json|*.txt|*.ps1|*.sh|*.yml|LICENSE|.gitignore|.gitattributes) ;;
              *) echo "unexpected file tracked: $f"; bad=1 ;;
            esac
          done < <(git ls-files)
          exit $bad

      - name: self-tests
        shell: bash
        run: |
          for m in settings sources configure vidbot broll upload status voices finish; do
            echo "--- $m"
            python $m.py --demo
          done

      - name: still fine once a config exists
        shell: bash
        run: |
          cp config.example.json config.json
          for m in settings sources configure vidbot broll upload status voices finish; do
            python $m.py --demo
          done

      - name: presets are valid json and pass validation
        run: python configure.py --check
